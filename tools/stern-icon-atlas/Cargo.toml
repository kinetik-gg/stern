[workspace]
resolver = "3"

[package]
name = "stern-icon-atlas"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kinetik-gg/stern"
publish = false
description = "Offline icon source ingestion and Rust definition tooling for Stern"

[dependencies]
flate2 = "1.1"
kurbo = "0.13"
quick-xml = "0.39"
serde_json = "1.0"
sha2 = "0.10"
svgtypes = "0.15"
tar = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
