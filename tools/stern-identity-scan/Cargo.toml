[workspace]
resolver = "3"

[package]
name = "stern-identity-scan"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kinetik-gg/stern"
publish = false
description = "Repository identity conformance scanner for Stern"

[dependencies]
icu_collator = "=2.2.0"
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
